<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканирование ПГ3 — ОТК</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .pg3-body {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .pg3-container {
            width: 100%;
            max-width: 700px;
        }
        .pg3-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .pg3-header h1 { font-size: 24px; margin-bottom: 6px; }
        .pg3-header p { color: #888; font-size: 14px; }

        .capture-zone {
            background: #1e2128;
            border: 2px dashed #3a3d45;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
        }
        .preview-area { margin-bottom: 20px; }
        .preview-area img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
        }
        .camera-icon { font-size: 56px; display: block; margin-bottom: 10px; }

        .btn-capture, .btn-upload {
            display: inline-block;
            padding: 14px 20px;
            margin: 6px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            font-weight: 600;
            width: calc(100% - 12px);
        }
        .btn-capture { background: #ff6b35; color: #fff; }
        .btn-upload { background: #2a2d35; color: #ccc; border: 1px solid #3a3d45; }

        .result-card {
            margin-top: 24px;
            background: #1e2128;
            border-radius: 16px;
            padding: 24px 18px;
        }
        .scanning-animation { text-align: center; padding: 20px; }
        .scan-line {
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff6b35, transparent);
            animation: scanMove 1.5s infinite;
            margin-bottom: 16px;
        }
        @keyframes scanMove {
            0% { width: 0%; margin-left: 0%; }
            50% { width: 100%; margin-left: 0%; }
            100% { width: 0%; margin-left: 100%; }
        }

        .field-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .field-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
        .field-label { font-size: 13px; color: #888; min-width: 60px; flex-shrink: 0; }
        .field-value {
            flex: 1;
            padding: 12px 14px;
            background: #2a2d35;
            border: 1px solid #3a3d45;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        .items-table th, .items-table td {
            padding: 10px 8px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #2a2d35;
        }
        .items-table th { color: #ff6b35; }

        .btn-next {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body class="pg3-body">
    <div class="pg3-container">
        <div class="pg3-header">
            <h1>📋 Перечень элементов (ПГ3)</h1>
            <p>Сфотографируйте ПГ3. Система извлечёт перечень позиций.</p>
        </div>

        <div class="capture-zone">
            <div class="preview-area" id="previewArea">
                <span class="camera-icon">📷</span>
                <p>Нажмите чтобы сделать фото</p>
            </div>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
            <input type="file" id="galleryInput" accept="image/*" hidden>
            <button class="btn-capture" id="captureBtn">📷 Сделать фото</button>
            <label for="galleryInput" class="btn-upload">📁 Загрузить из галереи</label>
        </div>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="scanning-animation" id="scanAnimation">
                <div class="scan-line"></div>
                <p>Идет распознавание… Извлечение позиций…</p>
            </div>
            <div class="result-data" id="resultData" style="display: none;">
                <h2>Проверьте данные:</h2>
                
                <div class="field-row">
                    <span class="field-icon">📄</span>
                    <span class="field-label">Номер ПГ3</span>
                    <input type="text" id="pg3Number" class="field-value" onfocus="this.blur()">
                </div>
                <div class="field-row">
                    <span class="field-icon">⚙️</span>
                    <span class="field-label">Изделие</span>
                    <input type="text" id="pg3Product" class="field-value" onfocus="this.blur()">
                </div>

                <h3 style="margin-top: 20px;">📦 Позиции:</h3>
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Поз.</th>
                            <th>Наименование</th>
                            <th>Кол.</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody"></tbody>
                </table>

                <button class="btn-next" onclick="goNext()">Далее →</button>
            </div>
        </div>
    </div>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const captureBtn = document.getElementById('captureBtn');
        const resultCard = document.getElementById('resultCard');
        const scanAnimation = document.getElementById('scanAnimation');
        const resultData = document.getElementById('resultData');
        let currentItems = [];

        captureBtn.addEventListener('click', () => cameraInput.click());

        [cameraInput, galleryInput].forEach(input => {
            input.addEventListener('change', () => {
                const file = input.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewArea').innerHTML =
                        `<img src="${e.target.result}" alt="Фото ПГ3">`;
                };
                reader.readAsDataURL(file);

                resultCard.style.display = 'block';
                scanAnimation.style.display = 'block';
                resultData.style.display = 'none';

                const formData = new FormData();
                formData.append('file', file);

                fetch('/api/scan-pg3', { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {                    
                        if (data.status === 'error') {
                            alert(data.message);
                            resultCard.style.display = 'none';
                            return;
                        }
                        scanAnimation.style.display = 'none';
                        resultData.style.display = 'block';
                        
                        document.getElementById('pg3Number').value = data.pg3_number || 'НЕ НАЙДЕНО';
                        document.getElementById('pg3Product').value = data.found_product || 'НЕ НАЙДЕНО';
                        
                        currentItems = data.items || [];
                        renderItems();
                    })
                    .catch(err => alert('Ошибка: ' + err));
            });
        });

        function renderItems() {
            const tbody = document.getElementById('itemsBody');
            if (!currentItems || currentItems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#888;">Позиции не найдены</td></tr>';
                return;
            }
            tbody.innerHTML = currentItems.map(item => `
                <tr>
                    <td>${item.position || ''}</td>
                    <td>${item.name || ''}</td>
                    <td>${item.quantity || '1'}</td>
                </tr>
            `).join('');
        }

        function goNext() {
            const params = new URLSearchParams(window.location.search);
            window.location.href = '/protocol?' + params.toString();
        }
    </script>
</body>
</html>
