<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОТК Сканер — Контроль качества</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="welcome-body">

    <div class="welcome-container">
        <!-- Левая панель -->
        <div class="welcome-left">
            <div class="logo-block">
                <span class="logo-icon">⚙️</span>
                <h1>ОТК 3.0</h1>
            </div>
            <div class="status-block">
                <span class="status-dot online"></span>
                Сервер: Онлайн
            </div>
            <div class="status-block">
                <span class="status-dot"></span>
                Версия 1.0.0 beta
            </div>
        </div>

        <!-- Правая панель -->
        <div class="welcome-right">
            <div class="login-card">
                <h2>Вход в систему контроля качества</h2>
                <p class="subtitle">Цифровой приёмщик ОТК</p>

                <form action="/scan" method="get">
                    <label for="badge">Табельный номер</label>
                    <input type="text" id="badge" name="badge"
                           placeholder="Введите ваш табельный номер"
                           required>

                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required>

                    <button type="submit" class="btn-primary">
                        Приступить к испытаниям
                    </button>
                </form>

                <p class="footer-note">
                    Все действия фиксируются. Время сервера: МСК
                </p>
            </div>
        </div>
    </div>

</body>
</html>
